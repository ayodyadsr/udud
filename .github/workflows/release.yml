name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            cflags: "-O3 -march=x86-64-v2 -flto -Wall -Wno-misleading-indentation -static"
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            cflags: "-O3 -march=armv8-a -flto -Wall -Wno-misleading-indentation -static"
    steps:
      - uses: actions/checkout@v6

      - name: build
        run: |
          make CFLAGS="${{ matrix.cflags }}"
          strip xcull
          ./xcull --version | head -n1
          printf 'http://example.com/a?id=1\nhttp://example.com/a?id=2\n' | ./xcull

      - name: package
        run: |
          tarball="xcull-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$tarball" xcull LICENSE.md README.md
          sha256sum "$tarball" > "$tarball.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            xcull-*.tar.gz
            xcull-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.sha256
