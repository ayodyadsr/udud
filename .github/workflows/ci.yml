name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build + test (${{ matrix.runner }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v6

      - name: build
        run: make CC=${{ matrix.cc }}

      - name: smoke check
        run: make check

      - name: golden tests
        run: make test
